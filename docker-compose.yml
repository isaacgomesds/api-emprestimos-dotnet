services:
    postgres:
        image: postgres:17
        container_name: api-emprestimos-postgres
        environment:
            POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB in .env}
            POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER in .env}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
        ports:
            - '127.0.0.1:5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 5s
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        container_name: api-emprestimos-redis
        ports:
            - '127.0.0.1:6379:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10
        restart: unless-stopped

    api:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: api-emprestimos-api
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ConnectionStrings__LibraryDatabase: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
            Redis__ConnectionString: redis:6379
        ports:
            - '5000:8080'
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

volumes:
    postgres_data:
