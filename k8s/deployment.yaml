apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-emprestimos
  labels:
    app: api-emprestimos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-emprestimos
  template:
    metadata:
      labels:
        app: api-emprestimos
    spec:
      containers:
        - name: api-emprestimos
          image: api-emprestimos:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: api-emprestimos-config
            - secretRef:
                name: api-emprestimos-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
